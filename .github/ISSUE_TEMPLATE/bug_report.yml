name: Bug report
description: Something fails, crashes, or produces wrong output.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact ninferno / ninferno-serve command line, and the request if it is a server issue.
      render: bash
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Hugging Face id (and revision) or GGUF file the model was converted from.
      placeholder: Qwen/Qwen3.6-35B-A3B
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU, driver, CUDA
      description: From `nvidia-smi` and `nvcc --version`.
      placeholder: RTX 4090, driver 580.95, CUDA 13.1
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: NInferno commit
      description: "`git rev-parse --short HEAD` of the build, and CMAKE_CUDA_ARCHITECTURES."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The server or CLI output around the failure (`--log-level debug` helps).
      render: text
