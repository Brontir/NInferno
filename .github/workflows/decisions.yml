name: decisions

# The decision core on a machine with no GPU and no CUDA compiler (#620 step 13): the host-only
# closure of the selector, the price and the choice (ninferno_core_host, ninferno_ops_host_objects,
# ninferno_product_choice) is built in a decisions-only tree (NINFERNO_DECISIONS_ONLY: C and C++
# only, no media, converter or device code) and its tests are run, among them the selector golden's
# host twin, which must read the committed goldens of the arch's build set byte-equal. One
# configure per set: the sets are compile-time facts of the build (NINFERNO_BUILD_ARCH, NVFP4 present
# or not), as the release archives differ; CMAKE_CUDA_ARCHITECTURES picks them as in a full build.
# Of the toolkit only cuda_occupancy.h is read: the CUDA runtime's development package (headers, no
# nvcc) is installed for it. The sm_70 set builds with CUTLASS fetched, as its release does: the
# Volta CUTLASS sizes are host code (generic_volta_cutlass_sizes.cpp, #783), so its twin reads sm70/
# as the device build does.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a PR replaces its run. A master push is its own group (its sha), so a merge
  # batch runs every commit: a group holds one running and one pending run, and a newer pending
  # run would cancel the older one whatever cancel-in-progress says.
  group: decisions-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # One arch's host objects take well under this; the repository's cache space is shared.
      CCACHE_MAXSIZE: 500M
    strategy:
      fail-fast: false
      matrix:
        # 120a: the full set (NVFP4); 89: the base set; 75: the sm75 set; 70: the sm70 set
        # (CUTLASS fetched at configure).
        arch: ["120a", "89", "75", "70"]
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build ccache
      - name: CUDA 12.8 runtime headers (cuda_occupancy.h; no compiler)
        run: |
          wget -q --tries=5 --waitretry=5 --retry-connrefused \
            --retry-on-http-error=429,500,502,503,504 \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends cuda-cudart-dev-12-8
          # The package's headers live under targets/; include/ links there once the toolkit's
          # links are installed. Take whichever holds the header.
          dir=""
          for d in /usr/local/cuda-12.8/include /usr/local/cuda-12.8/targets/x86_64-linux/include; do
            if [ -f "$d/cuda_occupancy.h" ]; then dir=$d; break; fi
          done
          test -n "$dir" || { echo "no cuda_occupancy.h under /usr/local/cuda-12.8"; exit 1; }
          echo "CUDA_OCCUPANCY_DIR=$dir" >> "$GITHUB_ENV"
          # The runtime's headers alone: no compiler came with them.
          test ! -e /usr/local/cuda-12.8/bin/nvcc
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: decisions-ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: decisions-ccache-${{ matrix.arch }}-
      - name: Configure (decisions only)
        run: |
          cmake --preset decisions -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} \
            -DNINFERNO_CUDA_OCCUPANCY_INCLUDE_DIR="$CUDA_OCCUPANCY_DIR" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          # No CUDA language in the tree.
          ! grep -q '^CMAKE_CUDA_COMPILER' build-decisions/CMakeCache.txt
      # ccache keeps its default directory, ~/.cache/ccache, the path the cache step restores.
      - name: Build the decision core and its tests
        run: |
          cmake --build --preset decisions
          ccache -s
      - name: Run them (no GPU on this machine)
        run: |
          # The tree's host suite is exactly the eleven decision tests: a registration dropped,
          # renamed or added (made conditional, say) shows here instead of passing unseen.
          names='selector_golden_host route_policy generic_routes_host choice gate_atlas
                 route_cost_constants fitted_holdouts route_rules rmma_geometry device_identity
                 format_facts'
          expected=$(for n in $names; do echo "ninferno_${n}_test"; done | sort)
          found=$(ctest --test-dir build-decisions -N | sed -n 's/^ *Test *#[0-9]*: //p' | sort)
          host=$(ctest --test-dir build-decisions -N -L host | sed -n 's/^ *Test *#[0-9]*: //p' | sort)
          [ "$found" = "$expected" ] && [ "$host" = "$expected" ] || {
            echo "expected the eleven decision tests, all labeled host; registered:"; echo "$found"
            echo "labeled host:"; echo "$host"; exit 1; }
          ctest --preset decisions --no-tests=error
