name: golden-gate

# #620 step 9: a decision-path diff with no golden change needs the `goldens-equal` label.
# Its own workflow, so a label event cancels only this gate and never the lint run of the same SHA.
# Make `golden-gate` a required check in branch protection.
# `edited` re-runs the gate when the PR description or its base branch changes. A pull_request
# workflow is the PR's own copy, so this gate is a reminder for honest contributors, not a lock:
# a PR can remove the step or edit the gate. The gate prints a line when a PR edits its own files
# (the manifest, the two scripts, their tests, this file); a human reviewer has to read them.
# The base branch's golden_diff.py reads the PR's goldens: a PR that changes the golden grammar or
# the sampled widths gets exit 2 until the parser change has landed in a PR of its own.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: golden-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  golden-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The gate's own tests (path list against the selector's include closure)
        run: python3 -B tests/test_golden_gate.py
      - name: The golden diff tool's own tests
        run: python3 -B tests/test_golden_diff.py
      # The gate and its diff tool come from the base branch, so a PR cannot weaken them; only where
      # the base has no gate yet (its first landing) do the PR's own copies run.
      - name: Decision-path diff needs a golden change or the goldens-equal label
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          gate=tools/audit
          mkdir -p "$RUNNER_TEMP/gate"
          if git cat-file -e "origin/$BASE_REF:tools/audit/golden_gate.py" 2>/dev/null; then
            # The base has the gate: both files from there, or the step fails.
            git show "origin/$BASE_REF:tools/audit/golden_gate.py" > "$RUNNER_TEMP/gate/golden_gate.py"
            git show "origin/$BASE_REF:tools/audit/golden_diff.py" > "$RUNNER_TEMP/gate/golden_diff.py"
            gate="$RUNNER_TEMP/gate"
          fi
          rc=0
          python3 -B "$gate/golden_gate.py" --base-ref "$BASE_REF" --event "$GITHUB_EVENT_PATH" --paths tools/audit/decision_paths.txt || rc=$?
          if [ "$rc" -eq 2 ]; then
            # 2 is a tool failure, not a refusal: the label does not help.
            echo "::error::golden-gate exit 2: a tool failed, the label does not help. If the message above says a golden file is unreadable, a width is not sampled or a comment line is unknown, this PR changes the golden grammar or kTokens, which the base branch's golden_diff.py cannot read: land the golden_diff.py change in a PR of its own first, then rebase this one. Otherwise fix the named error."
          fi
          exit "$rc"
