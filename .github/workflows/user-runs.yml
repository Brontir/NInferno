name: user-runs

# Every file under docs/performance/user-runs/ is a user's measurement: untrusted input
# (docs/maintainer/validation-protocol.md). This job runs on pull_request, never
# pull_request_target: no secret reaches it and its token reads only. The validator and the release
# manifest are the base branch's, and the pull request's files are read as JSON data only.
#
# This file itself is the pull request's own copy: a pull request that edits it, or the files the
# check reads, can change the check. A pull request that adds or changes a result file must
# therefore change nothing outside docs/performance/user-runs/ (the first step says so), and the
# real guard is a maintainer's review, required through .github/CODEOWNERS and the branch's
# "require review from code owners" rule.
on:
  pull_request:
    paths: ["docs/performance/user-runs/**"]

permissions:
  contents: read

concurrency:
  group: user-runs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: The validator (base branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: The submitted files (pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: docs/performance/user-runs
          sparse-checkout-cone-mode: true
      - name: A result file comes alone
        working-directory: pr
        run: |
          # The merge commit against its base: what the pull request changes.
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          results=$(printf '%s\n' "$changed" | grep -E '^docs/performance/user-runs/.*\.json$' || true)
          outside=$(printf '%s\n' "$changed" | grep -v -E '^docs/performance/user-runs/' | grep -v '^$' || true)
          if [ -n "$results" ] && [ -n "$outside" ]; then
            echo "A pull request with a result file changes nothing outside docs/performance/user-runs/; it also changes:"
            printf '%s\n' "$outside"
            exit 1
          fi
      - name: Only plain JSON files and the README
        working-directory: pr/docs/performance/user-runs
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            name=${f#./}
            if [ -L "$f" ] || [ ! -f "$f" ]; then
              echo "not a regular file: ${name@Q}"; bad=1
            elif [ "$name" != README.md ] && ! [[ $name =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.json$ ]]; then
              echo "not a result file (NAME.json at the top of the folder): ${name@Q}"; bad=1
            fi
          done < <(find . -mindepth 1 ! -type d -print0)
          if [ -n "$(find . -mindepth 1 -type d)" ]; then echo "no folders here"; bad=1; fi
          exit $bad
      - name: Validate every result file
        run: |
          shopt -s nullglob
          files=(pr/docs/performance/user-runs/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no result files"; exit 0; fi
          # The validator escapes every control character it prints (a submitted string never
          # starts a line of its own), and the runner reads no command from its output besides.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          status=0
          python3 -I -B base/tools/kit/validate.py "${files[@]}" || status=$?
          echo "::$token::"
          exit $status
