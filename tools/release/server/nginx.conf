# ninferno.brontir.com: NInferno's releases (tools/release/server/README.md). TLS by certbot or the
# host's own; the site is static files under /srv/ninferno, where publish.sh keeps
# releases/latest -> v<newest> (a symbolic link it replaces atomically).
server {
    listen 443 ssl;
    http2 on;
    server_name ninferno.brontir.com;
    root /srv/ninferno;
    disable_symlinks off;

    # A published release never changes.
    location ~ ^/releases/v[0-9][^/]*/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The manifest moves with every release: always fresh.
    location = /releases/latest.json {
        add_header Cache-Control "no-cache";
        default_type application/json;
    }

    # /releases/latest/download/<file>: the newest release's file, short-lived in caches.
    location ~ ^/releases/latest/download/(?<file>[^/]+)$ {
        add_header Cache-Control "public, max-age=300";
        try_files /releases/latest/$file =404;
    }
}

server {
    listen 80;
    server_name ninferno.brontir.com;
    return 301 https://$host$request_uri;
}
