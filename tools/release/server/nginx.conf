# ninferno.brontir.com behind Traefik (TLS there): NInferno's releases, static and read-only.
# /srv/ninferno is mounted read-only; publish.sh keeps releases/latest -> v<newest>.
server {
    listen 8080;
    server_name ninferno.brontir.com;
    root /srv/ninferno;
    server_tokens off;
    autoindex off;
    disable_symlinks off;
    charset utf-8;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ /\. { return 404; }

    # A published release never changes.
    location ~ ^/releases/v[0-9][^/]*/[^/]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # The manifest and its signature move with every release: always fresh.
    location ~ ^/releases/latest\.json(\.sig)?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        default_type application/json;
        try_files $uri =404;
    }
    # /releases/latest/download/<file>: the newest release's file.
    location ~ ^/releases/latest/download/(?<file>[^/]+)$ {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /releases/latest/$file =404;
    }
    location = / { return 302 https://github.com/Brontir/NInferno; }
    location / { return 404; }
}
