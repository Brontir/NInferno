<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NInferno</title>
<script>try { const v = localStorage.getItem("ninferno-theme"); if (v) document.documentElement.dataset.theme = v; } catch (e) {}</script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--soft:#f0f2f5;--fg:#1a1d21;--muted:#646d78;--line:#e1e4e9;--accent:#4b3df5;--accent-hover:#3627d6;--accent-soft:#ecebfe;--accent-fg:#fff;
--ok:#1f8a4c;--ok-soft:#e2f4ea;--warn:#a86a00;--warn-soft:#fff2d9;--bad:#b42323;--bad-soft:#fce7e7;--bar-bg:#e7e9ee;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111316;--panel:#191c20;--soft:#20242a;--fg:#e7e9ec;--muted:#98a1ac;--line:#2a2f36;--accent:#8b80ff;--accent-hover:#a59dff;--accent-soft:#2a2650;--accent-fg:#0f0d24;
--ok:#6fd49b;--ok-soft:#173326;--warn:#f0c36b;--warn-soft:#3a2d11;--bad:#f29a9a;--bad-soft:#3d1c1c;--bar-bg:#2a2f36;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111316;--panel:#191c20;--soft:#20242a;--fg:#e7e9ec;--muted:#98a1ac;--line:#2a2f36;--accent:#8b80ff;--accent-hover:#a59dff;--accent-soft:#2a2650;--accent-fg:#0f0d24;
--ok:#6fd49b;--ok-soft:#173326;--warn:#f0c36b;--warn-soft:#3a2d11;--bad:#f29a9a;--bad-soft:#3d1c1c;--bar-bg:#2a2f36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1240px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:750;font-size:19px;letter-spacing:.01em}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--soft);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button:hover:not(:disabled):not(.on){background:color-mix(in srgb,var(--panel) 60%,transparent);color:var(--fg)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;line-height:18px;text-align:center}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)}.warn{background:var(--warn-soft);color:var(--warn)}.bad{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:6px;font:12px/1.5 var(--mono);white-space:nowrap;background:var(--panel)}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,select,input{font:inherit;color:var(--fg)}
button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;
  transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad)}
button:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
button.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
button.ghost:hover:not(:disabled){border-color:transparent;background:var(--soft);color:var(--fg)}
button.danger:hover:not(:disabled){background:var(--bad-soft);color:var(--bad)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled,button.primary:disabled{background:var(--soft);color:var(--muted);border-color:var(--line);cursor:not-allowed;box-shadow:none}
select,input[type=search]{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.gpus{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:14px}
.gpu{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer}
.gpu:hover{border-color:var(--muted)}
.gpu.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gpu .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bar{height:6px;background:var(--bar-bg);border-radius:3px;overflow:hidden;margin:7px 0 5px}
.bar>i{display:block;height:100%;background:var(--accent)}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.run{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.run .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run button{padding:3px 9px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.bar-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
.title{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.icons{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700}
.i-vision{background:var(--warn-soft);color:var(--warn)}.i-spec{background:var(--accent-soft);color:var(--accent)}.i-run{background:var(--ok-soft);color:var(--ok)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:12px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.list{max-height:70vh;overflow:auto}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:9px 12px}
.item:hover:not(:disabled){background:var(--soft);border-color:var(--line)}.item.sel,.item.sel:hover:not(:disabled){background:var(--accent-soft)}
.item .title{display:flex;gap:6px;align-items:center;min-width:0}
.item .title,.item .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .title .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.list{overflow-x:hidden}
.group{padding:8px 12px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.detail{padding:14px 16px}
.detail h3{margin:0 0 2px;font-size:18px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--soft);border-radius:10px;padding:12px;margin-bottom:12px}
.controls .ctl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);min-width:0}
@media (min-width:600px){.controls .ctl.wide{grid-column:span 2}}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{padding:2px 7px;font:11px/1.4 var(--mono)}
.controls output{font:600 14px/1 var(--mono);color:var(--fg)}
input[type=range]{width:100%;height:22px;margin:0;accent-color:var(--accent);cursor:grab}
input[type=range]:active{cursor:grabbing}
.pick{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.pick .big{font:700 16px/1.2 var(--mono)}
.pickmain{flex:1 1 320px;min-width:0}
.pickacts{display:flex;gap:8px;align-items:center}
ul.why{margin:5px 0 6px;padding-left:18px;font-size:12px;color:var(--fg)}
.pick.none{border-color:var(--bad);background:var(--bad-soft)}
.qwrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.quants{min-width:560px}
.quants.multi{min-width:640px}
.quants.multi .q{grid-template-columns:12px minmax(140px,2fr) 40px 70px minmax(96px,1fr) 72px 80px 80px}
.q{display:grid;grid-template-columns:12px minmax(140px,2fr) 40px 70px minmax(96px,1fr) 72px 80px;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.q:last-child{border-bottom:0}.q:hover{background:var(--soft)}.q.sel{background:var(--accent-soft)}
.q.head{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--soft);cursor:default;padding-block:6px}
.q.head span{cursor:help;line-height:1.25}
.q.head .num{white-space:normal}
.q.head small{display:block;font-size:10px;letter-spacing:0;text-transform:none;font-weight:600}
.q.off{opacity:.45;cursor:default}
.q.no{background:color-mix(in srgb,var(--bad-soft) 45%,transparent)}
.q.no>*{opacity:.55}.q.no .qn,.q.no .why{color:var(--bad);opacity:1}
.q.no:hover{background:var(--bad-soft)}
.why{font-size:11px}
.est{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:8px 2px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-full{background:var(--ok)}.d-tight{background:var(--warn)}.d-no{background:transparent;border:2px solid var(--bad)}
.pbar{height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden;margin:6px 0}
.pbar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
pre.log{margin:0;background:var(--soft);border-top:1px solid var(--line);padding:10px 12px;max-height:300px;overflow:auto;font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word}
.drawer{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:5}
.drawer .head{display:flex;align-items:center;gap:8px;padding:6px 12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.err{color:var(--bad)}
.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:4px;border-radius:50%;
  border:1px solid var(--muted);color:var(--muted);font:italic 600 9px/1 Georgia,serif;cursor:help;vertical-align:1px;text-transform:none;letter-spacing:0}
.info:hover{border-color:var(--accent);color:var(--accent)}
[data-tip]{cursor:help}
#tip{position:fixed;z-index:30;max-width:300px;padding:8px 10px;border-radius:8px;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);font:12px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  pointer-events:none;text-transform:none;letter-spacing:0;font-weight:400}
#tip b{font-weight:650}
.kvsel,.seg{display:flex;gap:4px;flex-wrap:wrap}
.kvsel button,.seg button{padding:3px 8px;font:12px/1.4 var(--mono)}
.seg button{font-family:inherit}
.kvsel button.on,.seg button.on,.kvsel button.on:hover:not(:disabled),.seg button.on:hover:not(:disabled){background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sortline{padding-block:8px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer;margin-left:auto}
.sup{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;flex:none;cursor:help}
.sup-star{background:#f5c518;color:#3d2e00}
.accel{margin:10px 0;padding:10px 12px;border:1px solid var(--line, #8883);border-radius:8px;display:flex;flex-direction:column;gap:6px}
.accel .seg{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:8px}
.accel .drt{border-collapse:collapse;width:100%;font-size:12px}
.accel .drt th,.accel .drt td{text-align:left;padding:4px 6px;border-top:1px solid var(--line, #8883);vertical-align:top}
.accel details summary{cursor:pointer}
.sup-full,.sup-pill-full{background:var(--ok-soft);color:var(--ok)}.sup-drafter,.sup-pill-drafter{background:var(--warn-soft);color:var(--warn)}
.sup-none,.sup-pill-none{background:var(--bad-soft);color:var(--bad)}.sup-unknown,.sup-pill-unknown{background:var(--soft);color:var(--muted)}
.kvsel button:disabled{opacity:.35}
.langpick{position:relative}
#lang{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono)}
.flag{display:inline-flex;width:20px;height:14px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:none}
.flag svg{width:100%;height:100%;display:block}
.langmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;display:grid;min-width:170px;padding:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.langmenu button{display:flex;gap:9px;align-items:center;border:0;background:transparent;text-align:left;padding:6px 8px}
.langmenu button.on{background:var(--accent-soft)}
.hubseg button{font:600 11px/1.4 var(--mono);padding:4px 7px}
.sup.spin{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.item.unsup .title .nm,.item.unsup .sub{opacity:.6}
.controls{gap:6px 18px;padding:8px 12px;margin-bottom:10px}
.controls .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.controls .row output{margin-right:4px}
.controls .presets{margin-left:auto}
.presets button.on{border-color:var(--accent);color:var(--accent)}
.controls label.row{cursor:pointer}
.pick{padding:8px 12px;gap:10px}
ul.why{margin:3px 0 4px}
.chatpanel{overflow:hidden}
.chatbar{padding-block:6px}
#chatframe{display:block;width:100%;height:calc(100vh - 210px);min-height:420px;border:0;background:var(--panel)}
a.btnlink{color:var(--accent);text-decoration:none;font-size:13px;padding:4px 8px;border-radius:8px}
a.btnlink:hover{background:var(--soft)}
[hidden]{display:none!important}
.update{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 12px;padding:9px 12px;border-radius:12px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.update.required{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.update .msg{flex:1;min-width:200px}
.update a{color:var(--accent)}
</style>
</head>
<body>
<main>
<header>
  <span class="brand">NInferno</span>
  <span id="exposure" class="pill ok"></span>
  <span class="muted" id="gpuerr"></span>
  <nav class="tabs">
    <button data-tab="models" class="on" data-t="tabModels"></button>
    <button data-tab="find" data-t="tabFind"></button>
    <button data-tab="downloads"><span data-t="tabDownloads"></span><span class="badge" id="dlcount" hidden></span></button>
    <button data-tab="chat" id="chattab" hidden><span data-t="chatTitle"></span></button>
  </nav>
  <span class="langpick"><button class="ghost" id="lang" aria-haspopup="true"></button><div class="langmenu" id="langmenu" hidden></div></span>
  <button class="ghost" id="theme" style="font-size:16px;line-height:1"></button>
</header>

<div class="update" id="update" hidden>
  <span class="msg" id="updmsg"></span>
  <a id="updnotes" target="_blank" rel="noopener noreferrer" hidden></a>
  <button class="ghost" id="updlog" hidden></button>
  <button class="ghost" id="updlater"></button>
  <button class="primary" id="updgo"></button>
</div>

<div class="gpus" id="gpus"></div>

<section id="tab-models">
  <div class="panel">
    <div class="bar-line">
      <b data-t="myModels"></b><span class="muted" id="mysum"></span>
      <span style="flex:1"></span>
      <span id="origline" class="muted"></span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th data-t="arch"></th><th data-t="params"></th><th data-t="publisher"></th><th data-t="model"></th>
        <th data-t="quant"></th><th class="num" data-t="size"></th><th data-t="modified"></th><th></th></tr></thead>
      <tbody id="mine"></tbody></table></div>
  </div>
</section>

<section id="tab-find" hidden>
  <div class="split">
    <div class="panel">
      <div class="bar-line"><input type="search" id="q" style="flex:1;min-width:0" autocomplete="off" spellcheck="false"><span class="seg hubseg" id="hubsel"></span></div>
      <div class="bar-line sortline"><span class="seg" id="sort"></span>
        <label class="chk"><input type="checkbox" id="hidenone"><span data-t="hideNone"></span></label></div>
      <div class="list" id="results"></div>
    </div>
    <div class="panel" id="detail"><div class="empty" data-t="pickOne"></div></div>
  </div>
</section>

<section id="tab-downloads" hidden>
  <div class="panel"><div id="downloads"></div></div>
</section>

<section id="tab-chat" hidden>
  <div class="panel chatpanel">
    <div class="bar-line chatbar"><b id="chattitle"></b><span class="muted" id="chatgpu"></span><span style="flex:1"></span>
      <a class="btnlink" id="chatnew" target="_blank" rel="noopener noreferrer"></a><button class="ghost" id="chatclose">✕</button></div>
    <iframe id="chatframe" title="chat"></iframe>
  </div>
</section>
</main>

<div id="tip" hidden></div>
<div class="drawer" id="drawer" hidden>
  <div class="head"><b id="drawertitle"></b><span style="flex:1"></span><button class="ghost" id="drawerclose">✕</button></div>
  <pre class="log" id="log"></pre>
</div>

<script>
"use strict";
const T = {
  en:{tabModels:"My models",tabFind:"Find",tabDownloads:"Downloads",myModels:"My models",arch:"Arch",params:"Params",publisher:"Publisher",model:"Model",
    quant:"Quant",size:"Size",modified:"Modified",run:"Run",chat:"Chat",stop:"Stop",log:"Log",del:"Delete",delq:"Delete?",yes:"Yes",no:"No",
    calibrate:"Calibrate speculation",original:"original",delOriginals:"Delete originals",originalsKept:"originals kept",
    noModels:"Nothing downloaded yet. Find a model in “Find”.",running:"running",ready:"ready",starting:"starting",
    search:"Search Hugging Face (org/name works too)",picks:"Our picks",hub:"Hugging Face",pickOne:"Pick a model on the left",
    context:"Context",parallel:"Parallel requests",gpu:"GPU",recommended:"Recommended",download:"Download",fitsFull:"fits",fitsTight:"tight",fitsNo:"does not fit",
    over8:"> 8 bit",drafter:"drafter",kvUnknown:"context cost unknown: only weights counted",need:"needs",of:"of",measured:"tok/s on this card (measured by us)",noChat:"The chat window is not part of this build.",
    llama:"llama.cpp",downloads:"downloads",likes:"likes",noDl:"No downloads.",done:"done",failed:"failed",cancel:"Cancel",here:"downloaded",
    localonly:"localhost only",exposed:"open to the network, with a key",nogpu:"no NVIDIA GPU visible",vision:"takes images",spec:"speculative heads",
    ago:"ago",justNow:"just now",min:"min",h:"h",d:"days",tokens:"tok",perReq:"per request",free:"freed",fail:"error",onGpu:"on GPU",openHf:"on Hugging Face",
    nothing:"nothing found",loading:"loading…",readingRepo:"Reading the repository: its files, then the model header (a large GGUF repository takes a few seconds)…",speculation:"speculation",specFallback:"spec fallback",profOwn:"own profile",profSimilar:"profile from",profGeneric:"generic profile",profNone:"no profile",
    ctxCol:"Context",quantTip:"The weights' format as the repository publishes it; ★ is what we would pick for this card, ✓ is downloaded",
    sizeTip:"Download size of the weights",
    ctxColTip:"How much context the card holds beside the weights\n256K ×3 + 40K: three requests at the model's full length at once, and 40K of cache left over for one more, shorter one",
    capFull:"{n} at the model's full context ({ctx}) at once\nand {rest} of cache left over",
    capShort:"One request with up to {ctx} tokens\nless than the model's own {native}: the weights leave no more room",

// The task mix behind "weighted": what people ask a local model for, roughly.
const FAMILY_WEIGHT = {code: 0.25, math: 0.2, prose: 0.3, thinking: 0.25};
const FAMILY_LABEL = {code: "famCode", math: "famMath", prose: "famProse", thinking: "famThinking"};
const KIND_LABEL = {mtp: "MTP", gemma4_assistant: "MTP (assistant)", nemotron_h_mtp: "MTP", dflash: "DFlash",
                    dflash2: "DFlash2", dspark: "DSpark", eagle3: "EAGLE3"};

const KIND_SPEC = {mtp: "mtp", gemma4_assistant: "mtp", nemotron_h_mtp: "mtp", dflash: "dflash", dflash2: "dflash2"};
// Our measured suite on this card: per configuration, the gain per task family against plain decode
// and the weighted mean. The sampled pass (the model's own temperature) runs each drafter's deepest
// depth only: a configuration takes its sampled gains when it has them, else the greedy ones.
function suiteHere(cat) {
  const g = gpuOf();
  const run = g && (cat.spec_suite || []).find(x => g.name.includes(x.gpu));
  if (!run) return null;
  const gainsOf = pass => {
    const rows = run.rows.filter(r => r.pass === pass), plain = {}, configs = {};
    rows.filter(r => r.config === "plain").forEach(r => { plain[r.family] = r.tok_s; });
    for (const r of rows) {
      if (r.config === "plain" || !(plain[r.family] > 0)) continue;
      (configs[r.config] = configs[r.config] || {})[r.family] = r.tok_s / plain[r.family];
    }
    return configs;
  };
  const greedy = gainsOf("greedy"), sampled = gainsOf("sampled");
  const out = [];
  for (const config of new Set([...Object.keys(greedy), ...Object.keys(sampled)])) {
    const pass = sampled[config] ? "sampled" : "greedy", gains = (pass === "sampled" ? sampled : greedy)[config];
    let w = 0, sum = 0;
    for (const [f, k] of Object.entries(FAMILY_WEIGHT)) if (gains[f] > 0) { sum += k * gains[f]; w += k; }
    if (w > 0) out.push({config, gains, pass, weighted: sum / w});
  }

}
// The best measured configuration of a drafter kind (its config prefix).
function bestOfKind(suite, kind) {

}
const gainChips = gains => Object.keys(FAMILY_WEIGHT).filter(f => gains[f] > 0)
  .map(f => `<span class="pill">${t(FAMILY_LABEL[f])} ×${gains[f].toFixed(2)}</span>`).join(" ");

function loadGain(n, deep) {
  const l = loadOf();
  if (!loadHere(l) || !l.by_depth || !l.by_depth.auto || !l.by_depth.none) return null;
  const a = l.by_depth.auto[String(n)], p = l.by_depth.none[String(n)];
  if (!a || !p || !a.length || !p.length) return null;
  const pick = v => (deep ? v[v.length - 1] : v[0]);

// Auto against plain on this card's measured load table, at the requests asked (the widest

  if (!counts.length) return null;

  }
  if (drafters.length) {

}
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-tab],[data-gpu],[data-log],[data-stop],[data-chat],[data-run],[data-tune],[data-del],[data-delyes],[data-delno],[data-delorig],[data-hub],[data-repo],[data-kv],[data-qi],[data-get],[data-go],[data-sort],[data-ctx],[data-hubsel]");
  if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.tab) setTab(d.tab);
  else if (d.chat) {
    if (ev.target.closest("[data-gpu]")) ev.stopPropagation();
    if (chatUi) openChat(+d.chat); else showError(t("noChat"));
  }
  else if (d.log) { const p = S.processes.find(x => x.id === +d.log); openLog(+d.log, p ? shortName(p.model) : ""); }
  else if (d.stop) { api("/api/stop", {id:+d.stop}).then(refreshState).catch(e => showError(e.message)); }
  else if (d.gpu !== undefined) { gpu = +d.gpu; catalogCache = {}; refreshState(); if (selected) loadRepo(); }
  else if (d.run !== undefined) { const m = mine[+d.run]; launch(m.artifact, "", el); }
  else if (d.tune !== undefined) { try { const j = await api("/api/tune", {artifact: mine[+d.tune].artifact, gpu}); openLog(j.id, t("calibrate")); } catch (e) { showError(e.message); } }
  else if (d.del !== undefined) { confirming.add(mine[+d.del].artifact); refreshMine(); }
  else if (d.delno !== undefined) { confirming.delete(mine[+d.delno].artifact); refreshMine(); }
  else if (d.delyes !== undefined) {
    const m = mine[+d.delyes]; confirming.delete(m.artifact);
    try { await api("/api/delete", {artifact: m.artifact}); } catch (e) { showError(e.message); }
    refreshMine();
  }
  else if (d.delorig !== undefined) {
    ev.preventDefault();
    const repos = d.delorig === "*" ? [...new Set(mine.filter(m => m.original_gib > 0).map(m => m.repo))] : [d.delorig];
    for (const repo of repos) { try { await api("/api/delete_original", {repo}); } catch (e) { showError(e.message); } }
    refreshMine();
  }
  else if (d.hubsel) setHub(d.hubsel);
  else if (d.sort) {
    sortBy = d.sort;
    try { localStorage.setItem("ninferno-sort", sortBy); } catch (e) {}
    renderSortBar(); search($("q").value.trim());
  }
  else if (d.ctx) { ctxValue = +d.ctx; $("ctx").value = sliderAt(ctxValue); renderBody(); }
  else if (d.hub) openRepo(d.hub, found.hub.find(h => h.id === d.hub));
  else if (d.repo) { selected.repo = d.repo; loadRepo(); }
  else if (d.kv) { kvType = d.kv; kvChosen = true; renderBody(); }
  else if (d.qi !== undefined) { const q = selected.quants[+d.qi]; if (!q.drafter && q.supported) { quantSel = q; renderBody(); } }
  else if (d.get !== undefined) prepare(selected.repo, quantSel.quant);
  else if (d.go !== undefined) { const here = localFor(selected.repo, quantSel.quant); launch(here ? here.artifact : selected.repo, here ? "" : quantSel.quant, el); }
});

// One tooltip for every [data-tip]: its first line bold, the rest as written.
document.addEventListener("mouseover", ev => {
  const el = ev.target.closest("[data-tip]"), tip = $("tip");
  if (!el || !el.dataset.tip) { tip.hidden = true; return; }
  const [head, ...rest] = el.dataset.tip.split("\n");
  tip.innerHTML = rest.length ? `<b>${esc(head)}</b><br>${rest.map(esc).join("<br>")}` : esc(head);
  tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tip.style.top = (r.bottom + h + 12 < innerHeight ? r.bottom + 6 : r.top - h - 6) + "px";
});
renderSortBar();
refreshState(); refreshMine();
setInterval(refreshState, 2000);
setInterval(() => { if (tab === "models") refreshMine(); }, 15000);
</script>
</body>
